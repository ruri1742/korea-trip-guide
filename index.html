<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>韓国旅行しおり</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="service-header">
        <div class="service-header__title">
          <span class="service-label">Korea Trip Guide</span>
          <h1>韓国旅行しおり</h1>
        </div>
        <button class="button button--secondary button--compact" id="openHelp" type="button">困ったとき</button>
      </header>

      <nav class="tab-list" aria-label="表示モード">
        <button class="tab-button active" type="button" data-mode="during" aria-selected="true">旅行中</button>
        <button class="tab-button" type="button" data-mode="before" aria-selected="false">旅行前</button>
      </nav>

      <main class="main-content">
        <section class="view active" id="duringView" aria-labelledby="duringTitle">
          <article class="cockpit-card" id="currentStepCard">
            <div class="cockpit-card__top">
              <div>
                <p class="section-label" id="duringTitle">いま</p>
                <h2 id="stepTitle"></h2>
              </div>
              <div class="time-chip" id="stepTime"></div>
            </div>

            <div class="place-strip">
              <span>場所</span>
              <strong id="stepPlace"></strong>
            </div>

            <p class="current-task" id="stepDescription"></p>

            <div class="cockpit-alert" id="focusBox"></div>

            <section class="cockpit-section" aria-labelledby="actionsTitle">
              <h3 id="actionsTitle">今やること</h3>
              <div class="action-list" id="actionList"></div>
            </section>

            <section class="cockpit-section" aria-labelledby="linksTitle">
              <div class="section-row">
                <h3 id="linksTitle">必要なリンク</h3>
                <span>1タップ</span>
              </div>
              <div class="button-list" id="linkList"></div>
            </section>

            <aside class="next-strip" aria-labelledby="nextTitle">
              <span id="nextTitle">次にやること</span>
              <p id="nextSummary"></p>
            </aside>
          </article>

          <button class="button button--secondary full-width" id="openSchedule" type="button">全体予定を見る</button>
        </section>

        <section class="view" id="beforeView" aria-labelledby="beforeTitle">
          <div class="page-heading">
            <p class="section-label">旅行前</p>
            <h2 id="beforeTitle">出発前に見るもの</h2>
          </div>

          <div class="section-grid">
            <section class="info-card">
              <h3>出発前チェックリスト</h3>
              <ul class="check-list" id="checklist"></ul>
            </section>

            <section class="info-card">
              <h3>未確定事項</h3>
              <ul class="plain-list" id="undecidedList"></ul>
            </section>

            <section class="info-card">
              <h3>同行者に共有したいこと</h3>
              <ul class="plain-list" id="shareList"></ul>
            </section>

            <section class="info-card">
              <h3>チケット・予約リンク</h3>
              <div class="button-list" id="ticketLinks"></div>
            </section>
          </div>
        </section>
      </main>

      <footer class="bottom-actions" aria-label="ステップ操作">
        <button class="button button--tertiary" type="button" id="prevStep">← 前のステップ</button>
        <button class="button button--secondary" type="button" id="footerSchedule">全体予定</button>
        <button class="button button--primary" type="button" id="nextStep">次のステップ →</button>
      </footer>
    </div>

    <dialog class="modal" id="scheduleDialog">
      <div class="modal__header">
        <h2>全体予定</h2>
        <button class="button button--tertiary button--icon" type="button" data-close="scheduleDialog" aria-label="閉じる">×</button>
      </div>
      <div class="schedule-list" id="scheduleList"></div>
    </dialog>

    <dialog class="modal" id="helpDialog">
      <div class="modal__header">
        <h2>困ったとき</h2>
        <button class="button button--tertiary button--icon" type="button" data-close="helpDialog" aria-label="閉じる">×</button>
      </div>
      <div class="help-content">
        <section class="info-card">
          <h3>ホテル住所</h3>
          <p id="hotelName"></p>
          <p class="korean-text" id="hotelAddress"></p>
        </section>
        <section class="info-card">
          <h3>目的地名</h3>
          <div class="phrase-grid" id="destinations"></div>
        </section>
        <section class="info-card">
          <h3>よく使う韓国語</h3>
          <div class="phrase-list" id="phrases"></div>
        </section>
        <section class="info-card">
          <h3>チケット一覧</h3>
          <div class="button-list" id="helpTickets"></div>
        </section>
        <section class="info-card">
          <h3>地図リンク</h3>
          <div class="button-list" id="helpMaps"></div>
        </section>
      </div>
    </dialog>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
